<title>Admin neu performancegrowth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: App-Shell wie im Kundenbereich. Linke Leiste mit 6 Bereichen, oben Suche und „Neu“, Inhalt in Karten. Handy: Leiste unten. */
:root{
  --bg:#f5f8ff; --fg:#0b1220; --brand:#2563eb; --brand-dark:#1d4ed8; --brand-soft:#e5edff;
  --card:#ffffff; --sunken:#f7f9fc; --border:#e6ecf5; --border-strong:#d6dee9; --muted:#5b6883;
  --ok:#059669; --ok-soft:#e7f7f1; --warn:#d97706; --warn-soft:#fff4e0; --bad:#e11d48; --bad-soft:#fdeaf0;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --fg:#e8edf7; --brand:#5b8cff; --brand-dark:#7aa2ff; --brand-soft:#17224a;
  --card:#121a2e; --sunken:#0f1628; --border:#1f2a44; --border-strong:#2b3a5c; --muted:#93a1bd;
  --ok:#34d399; --ok-soft:#0f2a22; --warn:#fbbf24; --warn-soft:#2b2210; --bad:#fb7185; --bad-soft:#2d1420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --fg:#e8edf7; --brand:#5b8cff; --brand-dark:#7aa2ff; --brand-soft:#17224a;
  --card:#121a2e; --sunken:#0f1628; --border:#1f2a44; --border-strong:#2b3a5c; --muted:#93a1bd;
  --ok:#34d399; --ok-soft:#0f2a22; --warn:#fbbf24; --warn-soft:#2b2210; --bad:#fb7185; --bad-soft:#2d1420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* Leiste */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--border);background:var(--card)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:4px 8px 16px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.logo span{color:var(--brand)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500}
.nav a:hover{background:var(--sunken);color:var(--fg)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:600;background:var(--brand);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.side .grow{flex:1}
.side .me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--border);margin-top:8px}
.av{width:30px;height:30px;border-radius:99px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
/* Kopf */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 28px;padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;color:var(--muted)}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:6px;padding:0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--card);border-radius:var(--r-md);padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-dark)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:var(--r-sm)}
.content{padding:24px 28px 80px;padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1240px;width:100%}
h1{font-size:24px;line-height:1.25;letter-spacing:-.4px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 18px;overflow-x:auto}
.tabs a{padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--fg);border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card>.ch{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.card>.cb{padding:14px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-b{background:var(--brand-soft);color:var(--brand)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-w{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-n{background:var(--sunken);color:var(--muted);border:1px solid var(--border)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row:hover{background:var(--sunken)}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:99px;flex:none}
.kpi{padding:16px 18px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunken);cursor:pointer}
.tw{overflow-x:auto}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{margin:2px 4px 4px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted)}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:13.5px}
.tile span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.set{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-top:1px solid var(--border)}
.set:first-child{border-top:0}
.set .ic{width:32px;height:32px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.set .ic svg{width:16px;height:16px}
.set b{display:block}
.note{border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:10px 12px;color:var(--muted);font-size:13px;background:var(--sunken)}
.spark{width:100%;height:120px;display:block}
.ok{color:var(--ok)}
.badge-new{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--brand);border:1px solid var(--brand);border-radius:6px;padding:0 5px;margin-left:6px}
.map td{white-space:normal;vertical-align:top}
.map td:first-child{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
/* Handy */
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .hide-s{display:none}
  .content{padding:18px 16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2,.g3,.split{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--border);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
  .bnav a.on{color:var(--brand)}
  .bnav svg{width:20px;height:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fld{display:grid;gap:4px}
.fld label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inp{border:1px solid var(--border-strong);background:var(--card);border-radius:var(--r-sm);padding:8px 10px;min-height:38px;display:flex;align-items:center;gap:6px}
.form{display:grid;gap:14px;padding:16px 18px}
.form.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--border)}
.tg:first-child{border-top:0}
.sw{width:38px;height:22px;border-radius:99px;background:var(--border-strong);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:left .15s}
.sw.on{background:var(--brand)}.sw.on::after{left:19px}
.chat{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--sunken)}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13.5px}
.msg.in{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.msg.out{background:var(--brand-soft);color:var(--fg);align-self:flex-end}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.pop{position:fixed;inset:0;z-index:20;background:rgba(11,18,32,.35);display:flex;align-items:flex-start;justify-content:center;padding:80px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pop .box{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.pop .box .inp{border:0;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:15px}
.pop input{border:0;outline:0;background:transparent;font:inherit;color:inherit;width:100%}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:10px 18px 4px}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--brand)}
.funnel{display:grid;gap:8px;padding:16px 18px}
.funnel div{display:grid;grid-template-columns:120px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px}
.slide{aspect-ratio:16/9;max-width:100%;border-radius:var(--r-md);border:1px solid var(--border);background:linear-gradient(135deg,var(--brand-soft),var(--card));display:grid;place-items:center;text-align:center;padding:24px}
.slide h3{font-size:26px;margin:0;letter-spacing:-.5px}
@media (max-width:860px){.form.two{grid-template-columns:minmax(0,1fr)}.funnel div{grid-template-columns:90px minmax(0,1fr) 46px}}
button.search{text-align:left;cursor:pointer}
.pop[hidden]{display:none}
</style>

function spark(vals,col='var(--brand)'){const w=600,h=120,m=Math.max(...vals),n=vals.length;const pts=vals.map((v,i)=>[i*(w/(n-1)),h-8-(v/m)*(h-24)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const l=pts[n-1];return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Verlauf"><path d="${d} L ${w} ${h} L 0 ${h} Z" fill="var(--brand-soft)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="4" fill="${col}"/></svg>`}
const funnel=a=>{const m=a[0][1];return `<div class="funnel">${a.map(([l,v])=>`<div><span class="muted">${l}</span><span class="bar"><i style="width:${(v/m*100).toFixed(0)}%"></i></span><b style="text-align:right">${v.toLocaleString('de-DE')}</b></div>`).join('')}</div>`};

V.landkarte=()=>head('Was wo ist','Jede heutige Funktion und ihr Platz im neuen Aufbau. Klick auf eine Zeile öffnet den neuen Ort. Keine Funktion fällt weg.')+kpis([['Heute','60','Seiten, 7 Menüpunkte'],['Neu','6 + 1','Bereiche plus Einstellungen'],['Funktionen','409','alle mit neuem Ort'],['Regel','Arbeit oben','Einrichtung in Einstellungen']])+
card('Alle Funktionen ('+INV.length+')',`<div class="form" style="padding-bottom:6px"><div class="inp"><input id="fq" placeholder="Funktion, Seite oder Ort suchen" aria-label="Funktionen suchen" style="border:0;outline:0;background:transparent;font:inherit;color:inherit;width:100%"></div><div class="small muted" id="fnc"></div></div><div class="tw" style="max-height:560px;overflow:auto"><table class="map"><thead><tr><th>Heute</th><th>Funktion</th><th>Neuer Ort</th></tr></thead><tbody id="fn"></tbody></table></div>`)+'<div style="height:16px"></div>'+card('Umzugsliste der Seiten',`<div class="tw"><table class="map"><thead><tr><th>Heute</th><th>Neu</th><th>Hinweis</th></tr></thead><tbody>${MAP.map(r=>`<tr ${r[3]?`onclick="location.hash='${r[3]}'"`:''}><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="muted">${r[2]}</td></tr>`).join('')}</tbody></table></div>`);
function fnTable(){const box=document.getElementById('fn');if(!box)return;const q=document.getElementById('fq');const draw=()=>{const t=(q.value||'').toLowerCase();const r=INV.filter(x=>!t||x.join(' ').toLowerCase().includes(t));document.getElementById('fnc').textContent=r.length+' von '+INV.length;box.innerHTML=r.map(x=>`<tr onclick="location.hash='${x[3]}'"><td>${x[0]}</td><td style="font-family:var(--sans);color:var(--fg)">${x[1]}</td><td><b>${x[2]}</b></td></tr>`).join('')};q.addEventListener('input',draw);draw();}
V.mehr=()=>head('Mehr','')+card('',rows([{b:'Zahlen',h:'zahlen'},{b:'Einstellungen',h:'einstellungen'},{b:'Was wo ist',h:'landkarte'}]));

/* Suche und Neu */
const pop=document.getElementById('pop');
function openPop(html){pop.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;pop.hidden=false;const i=pop.querySelector('input');if(i)i.focus();}
pop.addEventListener('click',e=>{if(e.target===pop||e.target.closest('a'))pop.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')pop.hidden=true;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}});
function search(){openPop(`<div class="inp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Suchen" value="pat" aria-label="Suchen"></div><div class="sec">Kontakte</div>${rows([{b:'Christian Patzwald',s:'Vertrieb · Termin heute 11:00',h:'kontakt'}])}<div class="sec">Kunden</div>${rows([{b:'Finanzbüro Weiß',s:'aktiv · Katze',h:'kunde'}])}<div class="sec">Leads</div>${rows([{b:'Patrick N.',s:'Lead von Agentur Meyer',h:'leads-chat'}])}<div class="sec">Seiten</div>${rows([{b:'Pay-per-Lead',s:'Leads & Kampagnen',h:'leads-ppl'}])}`)}
document.getElementById('sbtn').addEventListener('click',search);
document.getElementById('neu').addEventListener('click',()=>openPop(`<div class="sec">Neu anlegen</div>${rows([{b:'Kontakt',s:'Vertrieb',h:'kontakt-neu'},{b:'Angebot',s:'für einen Kontakt',h:'angebot-neu'},{b:'Aufgabe',s:'mit oder ohne Kontakt',h:'vertrieb-aufgaben'},{b:'Termin buchen',s:'Meta-Leads-Call oder Entscheidungs-Call',h:'vertrieb-termine'},{b:'Zuordnung Formular → Kunde',s:'Lead-Eingang',h:'leads'},{b:'Pay-per-Lead-Bezug',s:'',h:'leads-bezug'},{b:'LinkedIn-Entwurf',s:'',h:'marketing'},{b:'Neuigkeit',s:'für den Kundenbereich',h:'e-neuigkeiten'},{b:'Kosten',s:'',h:'zahlen-kosten'}])}`));

const AREA={'kunden-berichte':'kunden',kontakt:'vertrieb','kontakt-neu':'vertrieb','angebot-neu':'vertrieb',praesentation:'vertrieb',kunde:'kunden'};
function render(){
  let v=(location.hash||'#heute').slice(1);
  if(!V[v])v='heute';
  const fs=INV.filter(x=>x[3]===v);
  document.getElementById('view').innerHTML=V[v]()+(fs.length&&v!=='landkarte'?`<details class="card" style="margin-top:18px"><summary style="padding:14px 18px;cursor:pointer;font-weight:600">Alle Funktionen dieser Seite (${fs.length})</summary><div class="tw"><table class="map"><thead><tr><th>Funktion</th><th>Neuer Ort</th><th>Heute</th></tr></thead><tbody>${fs.map(x=>`<tr><td style="font-family:var(--sans);color:var(--fg)">${x[1]}</td><td><b>${x[2]}</b></td><td class="muted">${x[0]}</td></tr>`).join('')}</tbody></table></div></details>`:'');
  if(v==='landkarte')fnTable();
  let a=AREA[v]||v.split('-')[0];
  if(a==='e')a='einstellungen';if(a==='kunde')a='kunden';
  document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===a));
  pop.hidden=true;window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);render();
</script>
