<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Geist,Arial,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#16254a 0%,#0b1220 62%);color:#fff;position:relative}
.top{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:26px;font-weight:600;color:#fde047}
.bot{position:absolute;left:0;right:0;top:1290px;text-align:center;font-size:24px;color:#cbd5e1}
.phone{position:absolute;left:220px;top:90px;width:640px;height:1180px;background:#0b1220;border:2px solid #2b3d66;border-radius:56px;padding:14px}
.scr{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#efeae2;position:relative}
.hd{height:120px;background:#075e54;padding:0 26px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:18px}
.hd b{font-size:28px}.hd small{font-size:22px;color:#cbd5e1}
.msgs{position:absolute;left:0;right:0;top:120px;bottom:0;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;overflow:hidden}
.m{max-width:84%;padding:14px 18px 30px;border-radius:18px;font-size:28px;font-weight:500;line-height:1.32;color:#111;background:#fff;position:relative;align-self:flex-start;border-top-left-radius:4px}
.m.c{background:#d9fdd3;align-self:flex-end;border-top-left-radius:18px;border-top-right-radius:4px}
.m .t{position:absolute;right:14px;bottom:6px;font-size:18px;color:#667781}
.typ{align-self:flex-start;background:#fff;border-radius:18px;padding:16px 20px;display:flex;gap:7px}.typ i{width:11px;height:11px;border-radius:50%;background:#9aa;display:block}
.lab{position:absolute;left:24px;top:640px;width:190px;font-size:34px;font-weight:800;color:#60a5fa;line-height:1.1;opacity:0}
.card{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#16254a 0%,#0b1220 62%);display:flex;flex-direction:column;justify-content:center;padding:90px;opacity:0}
.card h1{font-size:80px;font-weight:800;line-height:1.08;letter-spacing:-1.5px}
</style></head><body>
<div class="top">Nachgestellt. Demodaten, erfundene Namen</div>
<div class="phone"><div class="scr"><div class="hd"><b>KI-Assistent · Agentur Beispiel</b><small>automatisierter Assistent</small></div><div class="msgs" id="msgs"></div></div></div>
<div class="lab" id="lab">Die verbotene Frage</div>
<div class="bot">Antwortzeit in der Regel unter einer Minute. Nachgestellt.</div>
<div class="card" id="c0"><h1>Dienstag, 12:31.<br><span style="color:#60a5fa">Anfrage Wohngebäude.</span></h1></div>
<div class="card" id="c1"><h1>Die Tarifberatung bleibt <span style="color:#60a5fa">beim Vermittler.</span></h1><div style="font-size:30px;color:#cbd5e1;margin-top:30px">Ole Kannapinn, performancegrowth</div></div>
<script>
const M=[[2,'a','Hallo Frau Muster, hier ist der KI-Assistent von Herrn Beispiel.','12:31'],[4,'a','Zwei kurze Fragen. Einfamilienhaus? Und ungefähr welches Baujahr?','12:31'],[6,'c','Ja, Einfamilienhaus. Ungefähr 1990 gebaut.','12:33'],[8,'a','Danke. Herr Beispiel hat Donnerstag 10 Uhr oder Freitag 16 Uhr frei.','12:33'],[12,'c','Welcher Tarif ist denn der beste? Reicht der günstigste?','12:34',1],[14,'a','Das bespricht Herr Beispiel persönlich mit Ihnen. Ich bin nur die KI.','12:34'],[16,'c','Nur grob? Was würden Sie nehmen?','12:34'],[18,'a','Da lege ich mich bewusst nicht fest. Das klärt Herr Beispiel.','12:34'],[20,'c','Okay. Dann Donnerstag 10 Uhr.','12:35'],[22,'a','Ist eingetragen, Donnerstag 10 Uhr bei Herrn Beispiel.','12:35'],[24,'a','Wenn Sie mögen, schicken Sie vorab ein Foto Ihrer Police.','12:35']];
const DUR=28;
function f(t,a,b){const d=0.35;return Math.max(0,Math.min(1,(t-a)/d,(b-t)/d))}
function render(t){
 let h='';
 for(const [s,k,x,z,hl] of M){
  const show=s+0.6; // Tipp-Indikator davor (nur KI)
  if(k=='a'&&t>=s&&t<show){h+='<div class="typ"><i></i><i></i><i></i></div>';continue;}
  const st=k=='a'?show:s; if(t<st) continue;
  const a=Math.min(1,(t-st)/0.25);
  h+=`<div class="m ${k=='c'?'c':''}" style="opacity:${a};transform:translateY(${(1-a)*20}px);${hl?'outline:4px solid #2563eb;':''}">${x}<span class="t">${z}</span></div>`;
 }
 document.getElementById('msgs').innerHTML=h;
 document.getElementById('lab').style.opacity=f(t,12,18);
 document.getElementById('c0').style.opacity=t<2?1:Math.max(0,1-(t-2)/0.35);
 document.getElementById('c1').style.opacity=Math.max(0,Math.min(1,(t-26)/0.4));
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
