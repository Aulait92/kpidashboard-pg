<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Geist,Arial,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#16254a 0%,#0b1220 60%);color:#fff;position:relative}
.cap{position:absolute;left:70px;right:70px;top:90px}
.cap h1{font-size:62px;line-height:1.1;font-weight:800;letter-spacing:-1.5px}
.cap h1 span{color:#60a5fa}
.demo{position:absolute;left:70px;top:30px;font-size:26px;color:#e2e8f0}
.sc{position:absolute;left:70px;width:620px;top:330px;opacity:0}
.card{background:#fff;color:#111;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.adh{display:flex;align-items:center;gap:16px;padding:22px 24px}
.av{width:60px;height:60px;border-radius:50%;background:#075e54;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.adh b{font-size:25px;display:block;position:relative}.adh small{font-size:20px;color:#64748b}
.adimg{height:300px;background:linear-gradient(135deg,#dbeafe,#eff6ff);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#1d4ed8;text-align:center;padding:30px;line-height:1.2}
.adcta{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#334155}.adcta span{background:#2563eb;color:#fff;border-radius:10px;padding:10px 18px;font-weight:700}
.ring{position:absolute;border:6px solid #60a5fa;border-radius:50%;pointer-events:none}
.form{padding:30px}.form h3{font-size:30px;margin-bottom:6px}.form p{color:#64748b;font-size:21px}
.fi{height:58px;border-radius:12px;background:#f1f5f9;border:1px solid #e2e8f0;margin-top:18px;display:flex;align-items:center;padding:0 18px;color:#94a3b8;font-size:22px}
.bt{margin-top:24px;height:68px;border-radius:14px;background:#2563eb;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:26px}
.big{font-size:300px;font-weight:800;color:#60a5fa;line-height:1;letter-spacing:-10px}
.sil{display:flex;gap:34px;align-items:flex-end;margin-top:20px}
.pp{width:120px;height:170px;position:relative}.pp:before{content:"";position:absolute;left:30px;top:0;width:60px;height:60px;border-radius:50%;background:#475569}.pp:after{content:"";position:absolute;left:0;bottom:0;width:120px;height:100px;border-radius:60px 60px 14px 14px;background:#475569}
.pp.me:before,.pp.me:after{background:#2563eb}
.wa{height:96px;background:#075e54;display:flex;align-items:center;padding:0 22px;gap:14px;color:#fff}
.wa .av{background:#fff;color:#075e54;width:52px;height:52px;font-size:20px}
.chat{background:#efe7dd;padding:24px 20px 30px;min-height:300px}
.m{max-width:90%;padding:16px 20px 30px;border-radius:18px;border-top-left-radius:4px;font-size:27px;line-height:1.38;background:#fff;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.m .t{position:absolute;right:14px;bottom:7px;font-size:16px;color:#667}
.sub{position:absolute;left:70px;width:620px;top:990px;font-size:34px;font-weight:700;line-height:1.3;background:rgba(11,18,32,.85);border-radius:16px;padding:14px 20px;opacity:0}
.who{position:absolute;left:700px;width:350px;top:1290px;text-align:center;font-size:19px;color:#cbd5e1;line-height:1.25}
.end{position:absolute;inset:0;background:#0b1220;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px;opacity:0}
.end h2{font-size:66px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:30px 0}.end h2 span{color:#60a5fa}
.end .u{font-size:34px;font-weight:700;background:#2563eb;border-radius:18px;padding:18px 34px}
.brand{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700}.brand i{width:46px;height:46px;border-radius:12px;background:#2563eb;display:inline-flex;align-items:center;justify-content:center}
</style></head><body>
<div class="demo">Nachgestellte Demo, Namen erfunden</div>
<div class="cap"><h1 id="cap"></h1></div>
<div class="sc" id="call" style="width:940px;top:330px"><div class="card" style="padding:26px 30px;display:flex;align-items:center;gap:22px"><div style="width:64px;height:64px;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg></div><div><b style="font-size:30px">Herr Yilmaz</b><div style="font-size:24px;color:#dc2626">Nicht erreicht</div></div><div style="margin-left:auto;font-size:24px;color:#64748b">Di 10:12</div></div></div>
<div class="sc" id="flip" style="width:940px;top:330px;text-align:center"><div style="display:inline-block;background:#fff;color:#111;border-radius:24px;padding:26px 40px;font-size:44px;font-weight:800">+ 14 Tage</div></div>
<div class="sc" id="chatbox" style="width:940px;top:480px"><div class="card"><div class="wa"><div class="av">TB</div><div><div style="font-size:24px;font-weight:600">Thomas Berger Versicherungen</div><div style="font-size:18px;opacity:.85">KI-Assistent</div></div></div><div class="chat" id="chat" style="min-height:520px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px"></div></div></div>
<div class="ring" id="fr"></div>
<div class="who" id="who" style="left:290px;width:500px;top:1060px">Ole Kannapinn, Ausschnitt aus meinem Präsentationsvideo</div>
<div class="sub" id="sub" style="left:110px;width:860px;top:1120px;text-align:center"></div>
<div class="end" id="end"><div class="brand"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></i>performancegrowth</div><h2>Nachfassen, ohne dass Sie <span>daran denken müssen.</span></h2><div class="u">performancegrowth.de/termin</div></div>
<script>
const CAP=[[0,'„Melden Sie sich <span>in zwei Wochen.</span>“'],[2.5,'Keiner <span>geht ran.</span>'],[11.0,'Angebot raus, <span>dann kommt nichts.</span>'],[20.0,'14 Tage später, <span>wie vereinbart.</span>'],[30.0,'']];
const MS=[
 {g:1,t:4.0,k:'a',x:'Guten Tag Herr Yilmaz, hier ist der KI-Assistent von Thomas Berger. Herr Berger hat Sie eben nicht erreicht. Wann passt es Ihnen besser?',z:'Di 10:14'},
 {g:1,t:8.0,k:'c',x:'Ab 17 Uhr.',z:'Di 10:20'},
 {g:2,t:11.5,k:'a',x:'Guten Abend Frau Albrecht, hier ist der KI-Assistent von Thomas Berger. Ist beim Angebot noch etwas offen?',z:'Do 18:30'},
 {g:2,t:14.5,k:'c',x:'Ja, die Selbstbeteiligung.',z:'Do 18:44'},
 {g:2,t:17.0,k:'a',x:'Das bespricht Herr Berger gern persönlich mit Ihnen. Passt Montag, 17:00 Uhr?',z:'Do 18:44'},
 {g:3,t:21.0,k:'a',x:'Guten Morgen Frau Sommer, hier ist der KI-Assistent von Thomas Berger. Sie hatten gebeten, dass wir uns in zwei Wochen melden. Passt Ihnen diese Woche ein kurzer Termin?',z:'Di 9:30'},
 {g:3,t:24.5,k:'c',x:'Ja, passt. Donnerstag nachmittags?',z:'Di 9:41'},
 {g:3,t:27.0,k:'a',x:'Donnerstag, 16:00 Uhr ist frei. Soll ich den Termin für Sie eintragen?',z:'Di 9:41'},
];
const G=[[1,3.6,11.0],[2,11.2,20.0],[3,20.8,30.0]];
const SUB=[[30.3,34.0,'Und Sie müssen nur noch beraten, verkaufen, das, was Sie am besten können.']];
const END=34.0,DUR=37;
function fade(t,a,b){const f=0.35;return Math.max(0,Math.min(1,(t-a)/f,(b-t)/f))}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(t){
 let c=CAP[0];for(const x of CAP)if(t>=x[0])c=x;document.getElementById('cap').innerHTML=c[1];
 document.getElementById('call').style.opacity=fade(t,2.5,11.0);
 document.getElementById('flip').style.opacity=fade(t,20.0,30.0);
 let g=null;for(const x of G)if(t>=x[1]&&t<x[2])g=x;
 const cb=document.getElementById('chatbox');cb.style.opacity=g?fade(t,g[1],g[2]):0;
 if(g){const ms=MS.filter(m=>m.g==g[0]&&t>=m.t).slice(-2);
  document.getElementById('chat').innerHTML=ms.map(m=>{const a=Math.min(1,(t-m.t)/0.3);const st=`opacity:${a};transform:translateY(${(1-a)*20}px);`+(m.k=='c'?'background:#d9fdd3;align-self:flex-end;border-top-left-radius:18px;border-top-right-radius:4px;':'');return `<div class="m" style="${st}">${esc(m.x)}<span class="t">${m.z}</span></div>`}).join('');}
 const s=document.getElementById('sub');let st='';for(const [a,b,x] of SUB)if(t>=a&&t<b)st=x;s.textContent=st;s.style.opacity=st?1:0;
 const fr=document.getElementById('fr');
 const big=(t<2.5)||(t>=30&&t<34.2);
 fr.style.cssText=big?`left:274px;top:404px;width:532px;height:532px;opacity:${t<2.5?(t>2.2?(2.5-t)/0.3:1):Math.min(1,(t-30)/0.3)*(t>33.8?Math.max(0,(34.2-t)/0.4):1)}`:'opacity:0';
 document.getElementById('who').style.opacity=big?1:0;
 document.getElementById('end').style.opacity=Math.max(0,Math.min(1,(t-END)/0.5));
}
window.render=render;window.DUR=DUR;render(0);
</script></body></html>
