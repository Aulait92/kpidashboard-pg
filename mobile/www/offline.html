<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keine Verbindung</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f8fafc; color: #0f172a; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } }
  .box { max-width: 320px; text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #2563eb; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; opacity: .75; margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; color: #fff; background: #2563eb; border: 0; border-radius: 12px;
           padding: 12px 22px; width: 100%; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo" aria-hidden="true"></div>
    <h1>Keine Verbindung</h1>
    <p>Bitte prüfen Sie Ihre Internetverbindung. Sobald sie wieder da ist, geht es hier weiter.</p>
    <button onclick="location.href='https://app.performancegrowth.de/buyer'">Erneut versuchen</button>
  </div>
  <script>window.addEventListener('online', function () { location.href = 'https://app.performancegrowth.de/buyer'; });</script>
</body>
</html>
